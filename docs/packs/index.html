<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key packs · Agent Bar</title>
<meta name="description" content="Ready-made Agent Bar keys for Claude Code, Cursor, ChatGPT and writing. One click adds them to your bar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="packs.css">
</head>
<body>
<main class="wrap">
  <div class="top"><a class="brand" href="../"><span class="mark"><i></i><i></i></span>Agent Bar</a><a class="btn btn--ghost" href="https://github.com/kemet333/agent-deck/releases/latest/download/AgentBar.dmg">Download for Mac</a></div>
  <h1>Key packs.</h1>
  <p class="lead">Ready-made keys for the tools you use. Click «Add to Agent Bar»: it asks whether to add them to your keys or replace them. Made a good one? Settings → Key packs → Propose them for the gallery. Every pack here is checked by hand.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
function enc(p){var b=btoa(unescape(encodeURIComponent(JSON.stringify(p))));return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var g=document.getElementById('grid');
fetch('packs.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(c){
  (c.packs||[]).forEach(function(x){
    var p={name:x.name,keys:x.keys}, d=enc(p), el=document.createElement('article'); el.className='pack';
    el.innerHTML='<div><h2>'+esc(x.name)+'</h2><p class="by">'+esc(x.tool)+' · by '+esc(x.by)+'</p></div><p class="about">'+esc(x.about)+'</p><ul class="keys">'+x.keys.map(function(k){return '<li><b>'+esc(k.label)+'</b><span>«'+esc(k.text)+'»</span></li>';}).join('')+'</ul>'+
      '<div class="row"><a class="btn" href="agentdeck://pack?d='+d+'"><span class="dot"></span>Add to Agent Bar</a><a class="btn btn--ghost" href="../p/#'+d+'">Share link</a></div>';
    g.appendChild(el);
  });
}).catch(function(){g.innerHTML='<p class="empty">The packs didn\'t load. Refresh the page, or find them in the app: Settings → Key packs.</p>';});
</script>
<script>
// Afiliados de Lemon Squeezy: los enlaces ?aff=CÓDIGO cuentan para quien invita. Se enciende al poner el subdominio
// de la tienda (el mismo que Invite.storeSlug en la app); vacío, no se carga nada.
(function(){var store="";if(!store)return;window.lemonSqueezyAffiliateConfig={store:store};var s=document.createElement('script');s.src='https://lmsqueezy.com/affiliate.js';s.defer=true;document.head.appendChild(s);})();
</script>
</body>
</html>
